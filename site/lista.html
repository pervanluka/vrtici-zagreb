<!-- site/lista.html -->
<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista ustanova — slobodna mjesta u zagrebačkim vrtićima</title>
<link rel="stylesheet" href="stil.css">
</head>
<body>
<header class="zaglavlje">
  <div class="wrap">
    <a class="marka" href="index.html">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true" focusable="false"><rect x="1" y="1" width="24" height="24" rx="7" fill="#0f1115"/><circle cx="13" cy="10.5" r="3.4" fill="#f6f5f2"/><path d="M7.6 19.4h10.8" stroke="#c2410c" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span>Mjesta u vrtićima</span>
    </a>
    <nav class="navigacija" aria-label="Glavna navigacija">
      <a href="index.html">Karta</a>
      <a href="lista.html" aria-current="page">Lista</a>
      <a href="trend.html">Trend</a>
      <a href="ulaganja.html">Ulaganja</a>
      <a href="podaci.html">Podaci</a>
    </nav>
    <p class="ograda">Nezavisan projekt otvorenih podataka.<br><strong>Nije službena stranica Grada Zagreba.</strong></p>
  </div>
</header>

<div class="wrap">

  <div class="naslovni">
    <p class="znacka" id="znacka"></p>
    <h1>Lista ustanova</h1>
    <p class="uvod">Iste brojke kao na karti, u tablici koja se može sortirati po svakom stupcu.</p>
    <p class="napomena" id="napomena"></p>
  </div>

  <div class="filtri">
    <label for="cetvrt">Gradska četvrt<select id="cetvrt"></select></label>
    <label for="vrsta">Vrsta ustanove<select id="vrsta"></select></label>
    <label for="dobna">Dobna skupina<select id="dobna"></select></label>
    <label for="tekst">Pretraži<input id="tekst" type="search" placeholder="naziv ili adresa"></label>
    <label class="prekidac" for="samo"><input id="samo" type="checkbox" checked>Samo sa slobodnim mjestima</label>
  </div>

  <p class="rezultat" id="rezultat" role="status" aria-live="polite"></p>

  <div class="tablica-okvir">
    <table>
      <caption id="caption"></caption>
      <thead>
        <tr>
          <th scope="col" data-polje="naziv" data-naslov="Ustanova" tabindex="0">Ustanova</th>
          <th scope="col" data-polje="cetvrt" data-naslov="Gradska četvrt" tabindex="0">Gradska četvrt</th>
          <th scope="col" data-polje="vrsta" data-naslov="Vrsta" tabindex="0">Vrsta</th>
          <th scope="col" data-polje="slobodnih_prikaz" data-naslov="Slobodnih mjesta" tabindex="0">Slobodnih mjesta</th>
        </tr>
      </thead>
      <tbody id="tijelo"></tbody>
    </table>
  </div>

</div>

<script src="app.js"></script>
<script>
(function () {
  "use strict";
  var sve = [], sortPolje = "naziv", sortSmjer = 1;

  function trenutniFiltri() {
    return {
      cetvrt: document.getElementById("cetvrt").value,
      vrsta: document.getElementById("vrsta").value,
      dobnaSkupina: document.getElementById("dobna").value,
      tekst: document.getElementById("tekst").value.trim(),
      samoSlobodna: document.getElementById("samo").checked
    };
  }

  function crtaj() {
    var redovi = VZ.filtriraj(sve, trenutniFiltri()).sort(function (a, b) {
      var x = a[sortPolje], y = b[sortPolje];
      if (typeof x === "number") return (x - y) * sortSmjer;
      return String(x).localeCompare(String(y), "hr") * sortSmjer;
    });
    var tijelo = document.getElementById("tijelo");
    tijelo.innerHTML = "";
    redovi.forEach(function (u) {
      var tr = document.createElement("tr");
      var adrese = u.objekti.map(function (o) { return o.adresa; }).join(", ");
      [
        u.naziv + (adrese ? " — " + adrese : ""),
        u.cetvrt,
        u.vrsta,
        String(u.slobodnih_prikaz)
      ].forEach(function (v, i) {
        var td = document.createElement("td");
        td.textContent = v;
        if (i === 3) td.className = u.slobodnih_prikaz > 0 ? "ima" : "nema";
        tr.appendChild(td);
      });
      tijelo.appendChild(tr);
    });
    // Broj kao vrijednost uz oznaku — vidi napomenu u ulaganja.html.
    document.getElementById("rezultat").textContent = "Prikazano ustanova: " + redovi.length;
    azurirajZaglavlja();
  }

  function azurirajZaglavlja() {
    document.querySelectorAll("th[data-polje]").forEach(function (th) {
      var aktivno = th.dataset.polje === sortPolje;
      if (!aktivno) {
        th.removeAttribute("aria-sort");
        th.textContent = th.dataset.naslov;
        return;
      }
      th.setAttribute("aria-sort", sortSmjer === 1 ? "ascending" : "descending");
      th.textContent = th.dataset.naslov + (sortSmjer === 1 ? " ▲" : " ▼");
    });
  }

  document.querySelectorAll("th[data-polje]").forEach(function (th) {
    function prebaci() {
      var polje = th.dataset.polje;
      sortSmjer = polje === sortPolje ? -sortSmjer : 1;
      sortPolje = polje;
      crtaj();
    }
    th.addEventListener("click", prebaci);
    th.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); prebaci(); }
    });
  });

  VZ.ucitaj().then(function (d) {
    sve = d.ustanove;
    var poruka = "Stanje na dan " + VZ.datumStanja(d.datum_stanja) + " " + VZ.oznakaRazine();
    document.getElementById("znacka").textContent = "Stanje na dan " + VZ.datumStanja(d.datum_stanja);
    document.getElementById("napomena").textContent = poruka;
    document.getElementById("caption").textContent = poruka;
    VZ.napuniOdabir(document.getElementById("cetvrt"), VZ.jedinstveno(sve, "cetvrt"), "sve četvrti");
    VZ.napuniOdabir(document.getElementById("vrsta"), VZ.jedinstveno(sve, "vrsta"), "sve vrste");
    var mjesta = sve.reduce(function (a, u) { return a.concat(u.mjesta); }, []);
    VZ.napuniOdabir(document.getElementById("dobna"), VZ.jedinstveno(mjesta, "dobna_skupina"), "sve skupine");
    ["cetvrt", "vrsta", "dobna", "tekst", "samo"].forEach(function (id) {
      document.getElementById(id).addEventListener("input", crtaj);
    });
    crtaj();
  }).catch(function (e) {
    document.getElementById("rezultat").textContent = "Greška pri učitavanju podataka: " + e.message;
  });
})();
</script>
</body>
</html>
