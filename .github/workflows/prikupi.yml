name: Tjedni obilazak slobodnih mjesta

on:
  schedule:
    - cron: "17 5 * * 1"   # ponedjeljkom u 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  prikupi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pokreni kolektor
        id: kolektor
        shell: bash
        run: |
          python3 scripts/prikupi.py 2>&1 | tee izlaz.txt
          if grep -q "nema promjene" izlaz.txt; then
            echo "promjena=ne" >> "$GITHUB_OUTPUT"
          else
            echo "promjena=da" >> "$GITHUB_OUTPUT"
          fi

      # Tablica snimaka u data/README.md nije generirana pri objavi (objavi.yml
      # zadržava samo site/), pa bi bez ovog koraka zaostala za skupom već nakon
      # prvog automatskog mergea. Skripta ne dira mrežu.
      - name: Osvježi provenijenciju skupa
        if: steps.kolektor.outputs.promjena == 'da'
        run: python3 scripts/provenijencija.py

      - name: Otvori Pull Request
        if: steps.kolektor.outputs.promjena == 'da'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Datum dolazi iz kolektora, ne s datotečnog sustava. Ako Grad objavi
          # STARIJI mjesec, leksikografski zadnja datoteka nije ona koja je upravo
          # zapisana — grana bi dobila ime već mergeanog stanja, guard ispod bi se
          # okinuo i snimka bi tiho nestala uz zeleni build.
          DATUM=$(sed -n 's/^nova snimka \([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\):.*/\1/p' izlaz.txt)
          if [ -z "$DATUM" ]; then
            echo "Kolektor nije prijavio datum nove snimke — ne otvaram PR." >&2
            exit 1
          fi
          GRANA="podaci/$DATUM"
          # Postojanje grane NIJE dokaz da PR postoji. Ako je `gh pr create` jednom
          # pao, ovaj korak bi inače tjedno izlazio zeleno dok podaci vise na grani
          # koju nitko ne gleda — zato se provjerava sam PR, i zato se glasno javlja.
          if git ls-remote --exit-code --heads origin "$GRANA" >/dev/null 2>&1; then
            if [ -n "$(gh pr list --head "$GRANA" --state open --json number --jq '.[].number')" ]; then
              PORUKA="Grana $GRANA postoji, PR je otvoren i čeka pregled — nema novog dohvata."
            else
              PORUKA="Grana $GRANA postoji, ali OTVORENOG PR-A NEMA. Podaci za stanje $DATUM nisu ni u jednom PR-u — otvori ga ručno."
            fi
            echo "::warning::$PORUKA"
            echo "$PORUKA" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$GRANA"
          git add data/slobodna-mjesta/ data/README.md
          if git diff --cached --quiet; then
            echo "Nema promjena za commit — kolektor nije zapisao novu snimku." >&2
            exit 1
          fi
          git commit -m "podaci: slobodna mjesta na dan $DATUM"
          git push -u origin "$GRANA"
          TIJELO=$(printf '%s\n\n%s\n%s\n%s\n' \
            "$(cat izlaz.txt)" \
            "Automatski dohvat s https://vrtici.zagreb.hr/slobodna-mjesta/187." \
            "Kontrolni zbrojevi sa stranice provjereni su prije otvaranja ovog PR-a." \
            "Pregledaj promjene i mergeaj.")
          gh pr create --title "Slobodna mjesta — stanje $DATUM" --body "$TIJELO"
